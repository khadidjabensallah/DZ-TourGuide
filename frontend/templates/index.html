<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Tour Guide - Discover Algeria</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">🇩🇿 DZ Tour Guide</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#tours">Tours</a></li>
                <li><a href="#guides">Guides</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#" id="auth-link">Sign In</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section id="home" class="container" style="padding: 4rem 0; text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">Discover Algeria</h1>
            <p style="font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 2rem;">
                Explore the beauty of Algeria with experienced local guides
            </p>
            <div>
                <a href="#tours" class="btn btn-primary">Browse Tours</a>
                <a href="#signup" class="btn btn-outline" style="margin-left: 1rem;">Become a Guide</a>
            </div>
        </section>

        <!-- Tours Section -->
        <section id="tours" class="container" style="padding: 4rem 0;">
            <h2 style="font-size: 2rem; margin-bottom: 2rem; text-align: center;">Available Tours</h2>
            <div id="tours-container" class="grid grid-3">
                <div class="spinner"></div>
            </div>
        </section>

        <!-- Auth Modal -->
        <div id="auth-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;">
            <div class="card" style="max-width: 400px; width: 90%;">
                <h2 id="auth-title">Sign In</h2>
                <div id="auth-message"></div>
                <form id="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                </form>
                <p style="text-align: center; margin-top: 1rem;">
                    Don't have an account? <a href="#" id="switch-to-signup">Sign Up</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 DZ Tour Guide. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
