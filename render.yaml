services:
  # Backend Web Service (Django).
  # The React frontend is deployed separately on Vercel — see frontend/vercel.json.
  - type: web
    name: dz-tourguide-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dz-tourguide-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: dz-tourguide-backend.onrender.com
      - key: PYTHONPATH
        value: .
      # Comma-separated exact origins allowed to call the API. Set this to your
      # Vercel production URL (e.g. https://dz-tourguide.vercel.app). Any
      # *.vercel.app origin is already allowed via regex in settings.py.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        value: https://dz-tourguide-backend.onrender.com
      # --- Email via Resend (HTTPS API) ---
      # Render's free tier blocks outbound SMTP, so Gmail SMTP fails silently.
      # Resend sends over HTTPS and works on free plans. Create a key at
      # https://resend.com/api-keys and set it in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: FORCE_REAL_EMAIL
        value: "true"
      # Optional: a verified Resend sender. Leave unset to use onboarding@resend.dev.
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  # PostgreSQL Database
  - name: dz-tourguide-db
    plan: free
