services:
  # Backend Web Service
  - type: web
    plan: free
    name: dz-tourguide-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dz-tourguide-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: dz-tourguide-backend.onrender.com

  # Frontend Static Site
  - type: static
    name: dz-tourguide-frontend
    plan: free
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://dz-tourguide-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dz-tourguide-db
    plan: free
