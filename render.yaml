services:
  # Backend Web Service
  - type: web
    plan: free
    name: dz-tourguide-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn wsgi:application
    rootDirectory: backend

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dz-tourguide-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: dz-tourguide-backend.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: dz-tourguide-db
    plan: free
