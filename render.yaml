services:
  - type: web
    name: dz-tourguide-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dz-tourguide-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: dz-tourguide-backend.onrender.com

  - type: static_site
    name: dz-tourguide-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDirectory: frontend
    envVars:
      - key: VITE_API_URL
        value: https://dz-tourguide-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dz-tourguide-db
    plan: free
